[package]
name = "galnavi"
version = "0.1.0"
description = "Galgame 攻略路线导航器"
authors = ["GalNavi contributors"]
edition = "2021"

[lib]
name = "galnavi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
